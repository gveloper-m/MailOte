<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/emails.css">
    <link rel="stylesheet" href="css/attachments.css">
    <link rel="stylesheet" href="css/deleted.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="app">
        <!-- Auth Section -->
        <div id="auth-section" class="auth-section">
            <div class="auth-container">
                <h1>Mail Manager</h1>
                <p>Manage your mail inbox efficiently</p>
                <button id="login-btn" class="btn btn-primary">Login with Google</button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="dashboard-section hidden">
            <nav class="navbar">
                <div class="navbar-brand">MailOte</div>
                <div class="Logout">
                    <button id="logout-btn" class="nav-btn logout" onclick="logout()">Logout</button>
                </div>
            </nav>

            <div class="main-content">
                <!-- Inbox Section -->
                <div id="inbox-section" class="section active">
                    <div class="section-header">
                        <h2>Inbox</h2>
                        <div class="controls">
                            <input type="number" id="page-size" placeholder="Page Size" value="50" min="1" max="500">
                            <button id="load-emails-btn" class="btn btn-primary" onclick="loadEmails()">Load Emails</button>
                        </div>
                    </div>
                    <div id="emails-container" class="emails-container"></div>
                    <div id="pagination" class="pagination"></div>
                </div>

                <!-- Attachments Section -->
                <div id="attachments-section" class="section hidden">
                    <div class="section-header">
                        <h2>Emails with Attachments</h2>
                        <div class="controls">
                            <input type="number" id="attachment-page-size" placeholder="Page Size" value="50" min="1" max="500">
                            <button id="load-attachments-btn" class="btn btn-primary" onclick="loadAttachments()">Load Attachments</button>
                        </div>
                    </div>
                    <div id="attachments-container" class="attachments-container"></div>
                    <div id="attachments-pagination" class="pagination"></div>
                </div>

                <!-- Senders Section -->
                <div id="senders-section" class="section hidden">
                    <div class="section-header">
                        <h2>Senders</h2>
                        <button id="load-senders-btn" class="btn btn-primary">Load Senders</button>
                    </div>
                    <div id="senders-container" class="senders-container"></div>
                </div>

                <!-- Unsubscribe Section -->
                <div id="unsubscribe-section" class="section hidden">
                    <div class="section-header">
                        <h2>Unsubscribe from Emails</h2>
                        <button id="find-unsubscribe-btn" class="btn btn-primary">Find Unsubscribe Emails</button>
                    </div>
                    <div class="unsubscribe-controls">
                        <label class="select-all-label">
                            <input type="checkbox" id="select-all-unsubscribe">
                            Select All
                        </label>
                        <label>
                            <input type="checkbox" id="delete-after-unsubscribe">
                            Delete emails after unsubscribing
                        </label>
                        <button id="unsubscribe-selected-btn" class="btn btn-danger hidden">Unsubscribe Selected</button>
                    </div>
                    <div id="unsubscribe-list" class="unsubscribe-list"></div>
                </div>

                <!-- Statistics Section -->
                <div id="statistics-section" class="section hidden">
                    <div class="section-header">
                        <h2>Email Statistics</h2>
                        <div class="controls">
                            <label>
                                <input type="checkbox" id="refresh-stats">
                                Refresh from Gmail
                            </label>
                            <button id="load-stats-btn" class="btn btn-primary">Load Statistics</button>
                            <button id="export-stats-pdf-btn" class="btn btn-secondary">Export as HTML</button>
                            <button id="export-stats-csv-btn" class="btn btn-secondary">Export as CSV</button>
                        </div>
                    </div>
                    <div id="statistics-container" class="statistics-container"></div>
                </div>

                <!-- Deleted Emails Section -->
                <div id="deleted-section" class="section hidden">
                    <div class="section-header">
                        <h2>Deleted Emails</h2>
                        <div class="controls">
                            <input type="number" id="deleted-page-size" placeholder="Page Size" value="50" min="1" max="500">
                            <button id="load-deleted-btn" class="btn btn-primary">Load Deleted</button>
                        </div>
                    </div>
                    <div id="deleted-container" class="deleted-container"></div>
                    <div id="deleted-pagination" class="pagination"></div>
                </div>

                <!-- Export Section -->
                <div id="export-section" class="section hidden">
                    <div class="section-header">
                        <h2>Export All Emails</h2>
                        <p>Download all your emails in different formats</p>
                    </div>
                    <div class="export-buttons">
                        <button id="export-pdf-btn" class="btn btn-primary">Export as HTML (PDF)</button>
                        <button id="export-csv-btn" class="btn btn-primary">Export as CSV</button>
                    </div>
                    <div id="export-progress" class="progress hidden">
                        <div class="progress-bar"></div>
                        <span id="progress-text">Exporting...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="spinner hidden">
        <div class="spinner-circle"></div>
        <p class="spinner-text" id="spinner-message">Loading... this might take several minutes</p>
    </div>
    <div id="spinner-overlay" class="spinner-overlay hidden"></div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/inbox.js"></script>
    <script src="js/attachments.js"></script>
    <script src="js/senders.js"></script>
    <script src="js/unsubscribe.js"></script>
    <script src="js/statistics.js"></script>
    <script src="js/deleted.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
